server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

pulsar:
  url: "pulsar://localhost:6650"
  tenant: "mnemosyne"
  namespace: "mneme"
  token: ""
  operation_timeout: 30s
  connection_timeout: 10s
  subscription_name: "mneme-sub"
  topics:
    history: "mneme-history"
    traces: "mneme-traces"
    memory: "mneme-memory"

clickhouse:
  hosts: ["localhost:9000"]
  database: "mnemosyne"
  username: "default"
  password: ""
  max_open_conns: 10
  max_idle_conns: 5
  dial_timeout: 10s
  batch_size: 10000
  flush_interval: 5s
  max_retries: 5
  auto_migrate: true

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  dial_timeout: 5s
  pool_size: 20

consumer:
  history_enabled: true
  traces_enabled: true
  memory_enabled: true
  # 轨迹聚合窗口
  trace_aggregate_timeout: 30s
  # 长期记忆萃取周期
  memory_extract_interval: 10m

memory:
  llm:
    enabled: false
    endpoint: "http://localhost:11434/v1/chat/completions"
    model: "qwen2.5"
    api_key: ""
    timeout: 20s
    max_events: 200

filewatcher:
  enabled: false
  dirs: ["./data/inbox"]
  extensions: [".md", ".jsonl", ".txt"]
  debounce: 2s
  state_file: "./data/.filewatcher_state.json"
  tenant_id: "default"

archiver:
  enabled: false
  cron_hour: 3
  retain_months: 3
  tables: ["history_message"]
  export_dir: "./data/archive"
  # ClickHouse HTTP 接口地址（客户端侧 Parquet 导出）；留空则从 clickhouse.hosts 推导（端口换 8123）
  http_addr: ""
  oss:
    endpoint: ""
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    prefix: "mneme/archive"

telemetry:
  metrics_enabled: true
  tracing_enabled: false
  service_name: "mneme"
  otlp_endpoint: "localhost:4318"
  sample_ratio: 1.0

log:
  level: "info"
  format: "json"
