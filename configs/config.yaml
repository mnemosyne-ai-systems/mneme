server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

pulsar:
  url: "pulsar://localhost:6650"
  tenant: "mnemosyne"
  namespace: "mneme"
  token: ""
  operation_timeout: 30s
  connection_timeout: 10s
  subscription_name: "mneme-sub"
  topics:
    history: "mneme-history"
    traces: "mneme-traces"
    memory: "mneme-memory"

clickhouse:
  hosts: ["localhost:9000"]
  database: "mnemosyne"
  username: "default"
  password: ""
  max_open_conns: 10
  max_idle_conns: 5
  dial_timeout: 10s
  batch_size: 10000
  max_batch_bytes: 10485760    # 10MB, guards against oversized batches
  flush_interval: 5s
  max_retries: 5
  auto_migrate: true           # create tables on startup
  # Adaptive batch sizing
  adaptive_batch_enabled: true
  min_batch_size: 1000
  max_batch_size: 100000
  target_flush_latency: 100ms  # target flush latency

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 80
  min_idle_conns: 40
  conn_max_idle_time: 30m
  conn_max_lifetime: 1h

cache:
  session_ttl: 720h     # session cache TTL (0 = never expire; 720h = 30 days recommended)
  profile_ttl: 720h     # user profile cache TTL (0 = never expire; 720h = 30 days recommended)
  use_zset_index: true  # ZSET time indexes instead of SCAN (recommended in production)

consumer:
  history_enabled: true
  traces_enabled: true
  memory_enabled: true
  # Trace aggregation window
  trace_aggregate_timeout: 30s
  # Long-term memory extraction cycle
  memory_extract_interval: 10m
  # Extract user profiles from conversation history (merged into the same entity_memory table as
  # explicit memory events)
  history_profile_enabled: true
  history_profile_interval: 10m
  history_profile_max_messages: 500
  # Session-level summaries ("what did this conversation cover"), stored in session_summary
  session_summary_enabled: true
  session_summary_interval: 10m
  session_summary_max_messages: 2000

memory:
  llm:
    enabled: false
    endpoint: "http://localhost:11434/v1/chat/completions"
    model: "qwen2.5"
    api_key: ""
    timeout: 20s
    max_events: 200

filewatcher:
  enabled: false
  dirs: ["./data/inbox"]
  extensions: [".md", ".jsonl", ".txt"]
  debounce: 2s
  state_file: "./data/.filewatcher_state.json"
  tenant_id: "default"

# Standalone file collector (file-adapter); ignored when the main service runs filewatcher.
adapter:
  # http: POST batches to the server API (default, recommended; no knowledge of the message bus)
  # pulsar: publish directly to the message bus (high-throughput, trusted environments)
  mode: http
  http:
    endpoint: "http://localhost:8080/api/v1/history/batch"
    token: ""
    timeout: 10s
    max_retries: 5
    backoff_base: 500ms
    max_batch_size: 500

# Lightweight admin console (browse profiles, search sessions, data governance)
# Disabled by default; put it behind gateway auth in production.
# When token is non-empty, requests must send: Authorization: Bearer <token>
admin:
  enabled: true
  token: ""
  page_title: "Mneme Admin"

archiver:
  enabled: false
  cron_hour: 3
  retain_months: 3
  tables: ["history_message"]
  export_dir: "./data/archive"
  # ClickHouse HTTP endpoint (used for Parquet export); derived from clickhouse.hosts when empty
  # (port 9000 -> 8123)
  http_addr: ""
  oss:
    endpoint: ""
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    prefix: "mneme/archive"

telemetry:
  metrics_enabled: true
  tracing_enabled: false
  service_name: "mneme"
  otlp_endpoint: "localhost:4318"
  sample_ratio: 1.0

log:
  level: "info"
  format: "json"
