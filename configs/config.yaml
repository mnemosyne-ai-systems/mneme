server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

pulsar:
  url: "pulsar://localhost:6650"
  tenant: "mnemosyne"
  namespace: "mneme"
  token: ""
  operation_timeout: 30s
  connection_timeout: 10s
  subscription_name: "mneme-sub"
  topics:
    history: "mneme-history"
    traces: "mneme-traces"
    memory: "mneme-memory"

clickhouse:
  hosts: ["localhost:9000"]
  database: "mnemosyne"
  username: "default"
  password: ""
  max_open_conns: 10
  max_idle_conns: 5
  dial_timeout: 10s
  batch_size: 10000
  max_batch_bytes: 10485760    # 10MB
  flush_interval: 5s
  max_retries: 5
  auto_migrate: true
  # 自适应批次控制
  adaptive_batch_enabled: true
  min_batch_size: 1000
  max_batch_size: 100000
  target_flush_latency: 100ms  # 目标刷新延迟 100ms

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 80
  min_idle_conns: 40
  conn_max_idle_time: 30m
  conn_max_lifetime: 1h

cache:
  session_ttl: 720h      # 会话缓存 TTL，0 = 永不过期；例: 720h (30天)，生产建议 720h
  profile_ttl: 720h      # 用户画像缓存 TTL，0 = 永不过期；例: 720h (30天)，生产建议 720h
  use_zset_index: true   # 开启 ZSET 索引替代 SCAN（生产环境建议开启）

consumer:
  history_enabled: true
  traces_enabled: true
  memory_enabled: true
  # 轨迹聚合窗口
  trace_aggregate_timeout: 30s
  # 长期记忆萃取周期
  memory_extract_interval: 10m
  # 从对话历史中萃取用户画像（与显式记忆事件汇聚到同一张 entity_memory）
  history_profile_enabled: true
  history_profile_interval: 10m
  history_profile_max_messages: 500
  # 会话级总结（按 session_id 生成"本次对话聊了什么"，独立存储于 session_summary）
  session_summary_enabled: true
  session_summary_interval: 10m
  session_summary_max_messages: 2000

memory:
  llm:
    enabled: false
    endpoint: "http://localhost:11434/v1/chat/completions"
    model: "qwen2.5"
    api_key: ""
    timeout: 20s
    max_events: 200

filewatcher:
  enabled: false
  dirs: ["./data/inbox"]
  extensions: [".md", ".jsonl", ".txt"]
  debounce: 2s
  state_file: "./data/.filewatcher_state.json"
  tenant_id: "default"

# 独立文件采集器 file-adapter 的投递配置（主服务内嵌 filewatcher 时忽略本节）
adapter:
  # http: 推送到服务端批量 API（默认，推荐，无需感知消息总线拓扑）
  # pulsar: 直连消息总线（高吞吐可信环境）
  mode: http
  http:
    endpoint: "http://localhost:8080/api/v1/history/batch"
    token: ""
    timeout: 10s
    max_retries: 5
    backoff_base: 500ms
    max_batch_size: 500

# 轻量后台管理界面（用户/画像浏览、会话检索、数据治理）
# 默认关闭；生产建议配合网关鉴权。token 非空时要求 Authorization: Bearer <token>。
admin:
  enabled: true
  token: ""
  page_title: "Mneme 管理后台"

archiver:
  enabled: false
  cron_hour: 3
  retain_months: 3
  tables: ["history_message"]
  export_dir: "./data/archive"
  # ClickHouse HTTP 接口地址（客户端侧 Parquet 导出）；留空则从 clickhouse.hosts 推导（端口换 8123）
  http_addr: ""
  oss:
    endpoint: ""
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    prefix: "mneme/archive"

telemetry:
  metrics_enabled: true
  tracing_enabled: false
  service_name: "mneme"
  otlp_endpoint: "localhost:4318"
  sample_ratio: 1.0

log:
  level: "info"
  format: "json"
