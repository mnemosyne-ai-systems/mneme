name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到的具体痛点是什么？先说问题，再说方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你期望的功能行为、接口形态或配置项
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过但未选中的做法及原因

  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 是否涉及 API 契约变更、ClickHouse DDL、配置项、兼容性问题

  - type: checkboxes
    id: contrib
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现该功能
