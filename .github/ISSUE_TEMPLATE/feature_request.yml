name: Feature request
description: Propose a new feature or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What pain point are you hitting? Describe the problem before the solution
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behavior, API shape, or configuration you expect
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Approaches you evaluated and why you did not pick them

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: API contract changes, ClickHouse DDL, new configuration keys, compatibility
        concerns

  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this
