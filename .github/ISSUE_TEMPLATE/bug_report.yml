name: Bug report
description: Report a reproducible problem
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please confirm it reproduces on the latest `main` and that no
        existing issue covers it.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Provide runnable requests (curl / mneme.http) or a minimal code sample
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log lines with secrets, tokens, and user content redacted
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a1b2c3d

  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - docker run
        - docker compose (deploy/docker-compose.yaml)
        - Kubernetes
        - local go run
    validations:
      required: true

  - type: dropdown
    id: components
    attributes:
      label: Affected component
      multiple: true
      options:
        - internal/api (HTTP endpoints)
        - internal/consumer (consumption and extraction)
        - internal/service (profile/session stores)
        - pkg/cache (Redis)
        - pkg/storage (ClickHouse)
        - pkg/messagebus (Pulsar)
        - internal/filewatcher
        - Admin console (/admin)
        - Deployment / operations
        - Other

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: Reproduced on the latest main
        - label: Searched existing issues, no duplicate found
        - label: Redacted secrets and user data from the logs
