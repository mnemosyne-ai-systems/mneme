apiVersion: v1
kind: Service
metadata:
  name: mneme
  namespace: mnemosyne
  labels:
    app.kubernetes.io/name: mneme
    app.kubernetes.io/part-of: mnemosyne
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mneme
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Namespace
metadata:
  name: mnemosyne
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mneme
  namespace: mnemosyne
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mneme
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mneme
  namespace: mnemosyne
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mneme
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
