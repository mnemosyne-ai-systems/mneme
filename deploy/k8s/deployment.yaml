apiVersion: apps/v1
kind: Deployment
metadata:
  name: mneme
  namespace: mnemosyne
  labels:
    app.kubernetes.io/name: mneme
    app.kubernetes.io/part-of: mnemosyne
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mneme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mneme
        app.kubernetes.io/part-of: mnemosyne
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # 优雅退出：留出时间给消费者刷盘
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mneme
          image: mnemosyne/mneme:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/app/configs/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MNEME_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mneme-secrets
                  key: clickhouse-password
                  optional: true
            - name: MNEME_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mneme-secrets
                  key: redis-password
                  optional: true
            - name: MNEME_PULSAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mneme-secrets
                  key: pulsar-token
                  optional: true
            - name: MNEME_MEMORY_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mneme-secrets
                  key: llm-api-key
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: mneme-config
        - name: data
          emptyDir: {}
