apiVersion: v1
kind: ConfigMap
metadata:
  name: mneme-config
  namespace: mnemosyne
  labels:
    app.kubernetes.io/name: mneme
    app.kubernetes.io/part-of: mnemosyne
data:
  config.yaml: |
    server:
      port: 8080
      read_timeout: 15s
      write_timeout: 15s
      shutdown_timeout: 30s

    pulsar:
      url: pulsar://pulsar-broker.mnemosyne.svc.cluster.local:6650
      tenant: public
      namespace: mnemosyne
      operation_timeout: 30s
      connection_timeout: 10s
      subscription_name: mneme-sub
      topics:
        history: history-message
        traces: agent-traces
        memory: memory-events

    clickhouse:
      hosts:
        - clickhouse.mnemosyne.svc.cluster.local:9000
      database: mnemosyne
      username: default
      password: ""
      max_open_conns: 20
      max_idle_conns: 10
      dial_timeout: 10s
      batch_size: 1000
      flush_interval: 5s
      max_retries: 5
      auto_migrate: true

    redis:
      addr: redis.mnemosyne.svc.cluster.local:6379
      db: 0
      dial_timeout: 5s
      pool_size: 20

    consumer:
      history_enabled: true
      traces_enabled: true
      memory_enabled: true
      trace_aggregate_timeout: 30s
      memory_extract_interval: 60s

    memory:
      llm:
        enabled: false
        endpoint: ""
        model: gpt-4o-mini
        timeout: 30s
        max_events: 50

    filewatcher:
      enabled: false

    archiver:
      enabled: true
      cron_hour: 3
      retain_months: 3
      tables:
        - history_message
      export_dir: /app/data/archive

    telemetry:
      metrics_enabled: true
      tracing_enabled: false
      service_name: mneme
      otlp_endpoint: otel-collector.observability.svc.cluster.local:4318
      sample_ratio: 0.1

    log:
      level: info
      format: json
