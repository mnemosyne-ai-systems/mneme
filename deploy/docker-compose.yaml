# 本地开发依赖：Pulsar / ClickHouse / Redis
# 使用：make deps-up / make deps-down
# 首次启动由 pulsar-init 自动创建租户、命名空间与三个 Topic。

services:
  pulsar:
    image: apachepulsar/pulsar:3.2.2
    container_name: mneme-pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - pulsar-data:/pulsar/data

  # 一次性初始化：创建租户/命名空间/三个 Topic，幂等可重复执行。
  pulsar-init:
    image: apachepulsar/pulsar:3.2.2
    container_name: mneme-pulsar-init
    depends_on:
      pulsar:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set +e
        ADMIN="bin/pulsar-admin --admin-url http://pulsar:8080"
        $$ADMIN tenants create mnemosyne
        $$ADMIN namespaces create mnemosyne/mneme
        $$ADMIN topics create persistent://mnemosyne/mneme/mneme-history
        $$ADMIN topics create persistent://mnemosyne/mneme/mneme-traces
        $$ADMIN topics create persistent://mnemosyne/mneme/mneme-memory
        echo "pulsar init done"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: mneme-clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: mnemosyne
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  redis:
    image: redis:7.2-alpine
    container_name: mneme-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  pulsar-data:
  clickhouse-data:
  redis-data:
